<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Agent Usage HUD</title>
  <style>
    body { margin: 0; font: 12px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif; color: #e8e8ea; background: transparent; user-select: none; }
    .panel { box-sizing: border-box; padding: 12px; border-radius: 14px; background: rgba(20, 20, 24, 0.97); border: 1px solid rgba(255, 255, 255, 0.1); }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; -webkit-app-region: drag; cursor: move; }
    h1 { font-size: 13px; margin: 0; font-weight: 600; }
    .muted { color: #9a9aa3; font-size: 11px; }
    .tool { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .tool.collapsed { padding: 6px 0; }
    .tool.collapsed svg, .tool.collapsed .details { display: none; }
    svg { flex: none; }
    .track { fill: none; stroke: rgba(255, 255, 255, 0.08); }
    .arc { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(.2, .8, .2, 1), stroke 0.9s; }
    .info { flex: 1; min-width: 0; }
    .agent-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .name { font-weight: 600; font-size: 13px; }
    .collapse-button { width: 20px; height: 20px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 5px; color: #c8c8cf; font-size: 14px; line-height: 1; cursor: pointer; }
    .info div { font-variant-numeric: tabular-nums; }
    footer { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px; margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .footer-actions { display: flex; justify-content: space-between; align-items: center; }
    .login-option { grid-column: 1 / -1; display: flex; align-items: center; gap: 5px; color: #9a9aa3; font-size: 11px; cursor: pointer; }
    .login-option input { margin: 0; accent-color: #8b8b98; }
    #start-at-login-status { grid-column: 1 / -1; }
    button { background: none; border: 0; color: #9a9aa3; cursor: pointer; font: inherit; font-size: 11px; padding: 0; }
    button:hover, button:focus-visible { color: #fff; }
    .claude-setup { margin-top: 4px; line-height: 1.4; }
    .setup-button { padding: 4px 7px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 5px; color: #e8e8ea; }
    .setup-button:disabled { opacity: 0.6; cursor: default; }
    #key.capturing { color: #ffd166; }
  </style>
</head>
<body>
  <div class="panel">
    <header><h1>Agent usage</h1><span class="muted">usage limits</span></header>
    <div id="tools"></div>
    <footer>
      <button id="key" title="Click, then press a new shortcut"></button>
      <span class="footer-actions"><button id="close" title="Hide">hide</button> · <button id="quit" title="Quit app">quit</button></span>
      <label class="login-option"><input id="start-at-login" type="checkbox"> Start at login</label>
      <span id="start-at-login-status" class="muted" role="status"></span>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
